name: Test Skip Dirty Check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and set up local remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a local bare repo to act as the remote so git push succeeds
          git init --bare /tmp/remote-repo.git
          git remote set-url origin /tmp/remote-repo.git
          git push origin HEAD:act-harness

      - name: Create a file so there is something to commit
        run: |
          echo "skip dirty check test $(date)" > skip-dirty-test.txt

      - id: action
        uses: .
        with:
          commit_message: "Test: skip dirty check"
          branch: act-harness
          file_pattern: "skip-dirty-test.txt"
          skip_dirty_check: "true"
          skip_fetch: "true"
          skip_checkout: "true"
          commit_user_name: "Test Bot"
          commit_user_email: "bot@example.com"
          commit_author: "Test Bot <bot@example.com>"

      - name: Assert changes_detected is true
        env:
          ACTUAL: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "actual: $ACTUAL"
          # With skip_dirty_check=true and a staged file, changes_detected should be true
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected changes_detected to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: changes_detected is '$ACTUAL'"

      - name: Assert commit_hash is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected commit_hash to be non-empty when skip_dirty_check=true and changes present"
            exit 1
          fi
          echo "PASS: commit_hash is set: $ACTUAL"
