name: Test create_branch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up isolated test repository with local remote
        run: |
          set -e
          REMOTE=/tmp/gac-remote.git
          rm -rf "$REMOTE" "$GITHUB_WORKSPACE/test-repo"
          git init --bare "$REMOTE"
          git --git-dir="$REMOTE" symbolic-ref HEAD refs/heads/main
          mkdir -p "$GITHUB_WORKSPACE/test-repo"
          cd "$GITHUB_WORKSPACE/test-repo"
          git init
          git symbolic-ref HEAD refs/heads/main
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > README.md
          git add README.md
          git commit -m "initial commit"
          git remote add origin "file://$REMOTE"
          git push -u origin main
          git rev-parse HEAD > /tmp/initial-head
          echo "feature" > feature.txt
      - id: action
        uses: .
        with:
          repository: test-repo
          branch: feature-branch
          create_branch: true
          commit_message: "Add feature"
          commit_author: "Test Author <author@example.com>"
      - name: Assert new branch created and pushed
        env:
          CHANGES: ${{ steps.action.outputs.changes_detected }}
          HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "changes_detected: $CHANGES"
          echo "commit_hash: $HASH"
          if [ "$CHANGES" != "true" ]; then
            echo "FAIL: expected changes_detected=true"
            exit 1
          fi
          REMOTE=/tmp/gac-remote.git
          FEATURE="$(git --git-dir=$REMOTE rev-parse refs/heads/feature-branch 2>/dev/null || true)"
          MAIN="$(git --git-dir=$REMOTE rev-parse refs/heads/main)"
          echo "remote feature-branch: $FEATURE"
          echo "remote main: $MAIN"
          if [ "$FEATURE" != "$HASH" ]; then
            echo "FAIL: feature-branch not pushed with the new commit"
            exit 1
          fi
          if [ "$MAIN" != "$(cat /tmp/initial-head)" ]; then
            echo "FAIL: main should be unchanged"
            exit 1
          fi
          cd "$GITHUB_WORKSPACE/test-repo"
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          echo "local branch: $BRANCH"
          if [ "$BRANCH" != "feature-branch" ]; then
            echo "FAIL: local branch should be feature-branch"
            exit 1
          fi
          echo "PASS"
