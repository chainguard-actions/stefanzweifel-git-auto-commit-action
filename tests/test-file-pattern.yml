name: Test File Pattern
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and set up local remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a local bare repo to act as the remote so git push succeeds
          git init --bare /tmp/remote-repo.git
          git remote set-url origin /tmp/remote-repo.git
          git push origin HEAD:act-harness

      - name: Create files - one matching pattern, one not
        run: |
          echo "should be committed $(date)" > output.log
          echo "should NOT be committed $(date)" > output.txt

      - id: action
        uses: .
        with:
          commit_message: "Test: commit only log files"
          branch: act-harness
          file_pattern: "*.log"
          commit_user_name: "Test Bot"
          commit_user_email: "bot@example.com"
          commit_author: "Test Bot <bot@example.com>"
          skip_fetch: "true"
          skip_checkout: "true"

      - name: Assert changes_detected is true (log file was staged)
        env:
          ACTUAL: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected changes_detected to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: changes_detected is true"

      - name: Assert only log file was committed, not txt file
        env:
          COMMIT_HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "commit_hash: $COMMIT_HASH"
          COMMITTED_FILES=$(git diff-tree --no-commit-id -r --name-only "$COMMIT_HASH")
          echo "committed files: $COMMITTED_FILES"
          if ! echo "$COMMITTED_FILES" | grep -q "output.log"; then
            echo "FAIL: expected output.log to be in the commit"
            exit 1
          fi
          if echo "$COMMITTED_FILES" | grep -q "output.txt"; then
            echo "FAIL: output.txt should NOT be in the commit (doesn't match *.log pattern)"
            exit 1
          fi
          echo "PASS: only *.log files were committed"
