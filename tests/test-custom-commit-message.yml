name: Test Custom Commit Message
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up local bare git remote to allow push
        run: |
          # Create a bare repo to act as the remote so git push succeeds locally
          git init --bare /tmp/fake-remote.git
          git remote set-url origin /tmp/fake-remote.git
          # Push current state to the fake remote so it has the branch
          git push origin HEAD:act-harness

      - name: Create a changed file
        run: |
          echo "custom message test $(date)" > tests/custom-message-test-file.txt

      - id: action
        uses: .
        with:
          commit_message: "chore: my custom automated commit message"
          branch: "act-harness"
          file_pattern: "tests/custom-message-test-file.txt"
          commit_user_name: "Test Bot"
          commit_user_email: "testbot@example.com"
          commit_author: "Test Bot <testbot@example.com>"
          skip_fetch: "true"
          skip_checkout: "true"
          push_options: "--force"

      - name: Assert changes_detected is true
        env:
          CHANGES: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "changes_detected: $CHANGES"
          if [ "$CHANGES" != "true" ]; then
            echo "FAIL: expected changes_detected to be 'true', got '$CHANGES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert commit message was used
        env:
          HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "commit_hash: $HASH"
          if [ -z "$HASH" ]; then
            echo "FAIL: expected commit_hash to be set"
            exit 1
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s "$HASH")
          echo "commit message: $COMMIT_MSG"
          if [ "$COMMIT_MSG" != "chore: my custom automated commit message" ]; then
            echo "FAIL: expected commit message 'chore: my custom automated commit message', got '$COMMIT_MSG'"
            exit 1
          fi
          echo "PASS"
