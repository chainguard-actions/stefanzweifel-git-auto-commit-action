name: Test Custom Commit Message
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and set up local remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a local bare repo to act as the remote so git push succeeds
          git init --bare /tmp/remote-repo.git
          git remote set-url origin /tmp/remote-repo.git
          git push origin HEAD:act-harness

      - name: Create a new file to trigger changes
        run: |
          echo "custom message test $(date)" > custom-message-test.txt

      - id: action
        uses: .
        with:
          commit_message: "chore: my custom automated commit message"
          branch: act-harness
          file_pattern: "custom-message-test.txt"
          commit_user_name: "Test Bot"
          commit_user_email: "bot@example.com"
          commit_author: "Test Bot <bot@example.com>"
          skip_fetch: "true"
          skip_checkout: "true"

      - name: Assert changes_detected is true
        env:
          ACTUAL: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected changes_detected to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: changes_detected is true"

      - name: Assert commit message is correct
        env:
          COMMIT_HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "commit_hash: $COMMIT_HASH"
          COMMIT_MSG=$(git log -1 --pretty=%s "$COMMIT_HASH")
          echo "commit message: $COMMIT_MSG"
          if [ "$COMMIT_MSG" != "chore: my custom automated commit message" ]; then
            echo "FAIL: expected commit message 'chore: my custom automated commit message', got '$COMMIT_MSG'"
            exit 1
          fi
          echo "PASS: commit message matches expected value"
