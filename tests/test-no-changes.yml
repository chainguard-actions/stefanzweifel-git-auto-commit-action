name: Test No Changes Detected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          commit_message: "Test: no changes commit"
          branch: "act-harness"
          skip_fetch: "true"
          skip_checkout: "true"

      - name: Assert changes_detected is false
        env:
          CHANGES: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "changes_detected: $CHANGES"
          if [ "$CHANGES" != "false" ]; then
            echo "FAIL: expected changes_detected to be 'false', got '$CHANGES'"
            exit 1
          fi
          echo "PASS"

      - name: Assert commit_hash is empty
        env:
          HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "commit_hash: '$HASH'"
          if [ -n "$HASH" ]; then
            echo "FAIL: expected commit_hash to be empty when no changes, got '$HASH'"
            exit 1
          fi
          echo "PASS"
