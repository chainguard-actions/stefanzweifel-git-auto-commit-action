name: Test No Changes Detected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and set up local remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a local bare repo to act as the remote so git push succeeds
          git init --bare /tmp/remote-repo.git
          git remote set-url origin /tmp/remote-repo.git
          git push origin HEAD:act-harness

      - id: action
        uses: .
        with:
          commit_message: "Test: no changes commit"
          branch: act-harness
          skip_fetch: "true"
          skip_checkout: "true"

      - name: Assert changes_detected is false
        env:
          ACTUAL: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected changes_detected to be 'false', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: changes_detected is false as expected"

      - name: Assert commit_hash is empty
        env:
          ACTUAL: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected commit_hash to be empty when no changes, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: commit_hash is empty as expected"
