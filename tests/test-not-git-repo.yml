name: Test error when repository is not a git repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a plain (non-git) directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/not-a-repo"
          mkdir -p "$GITHUB_WORKSPACE/not-a-repo"
          echo "content" > "$GITHUB_WORKSPACE/not-a-repo/file.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: not-a-repo
          branch: main
          skip_push: true
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CHANGES: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "outcome: $OUTCOME"
          echo "changes_detected: '$CHANGES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for a non-git directory"
            exit 1
          fi
          if [ -n "$CHANGES" ]; then
            echo "FAIL: changes_detected should not be set"
            exit 1
          fi
          echo "PASS"
