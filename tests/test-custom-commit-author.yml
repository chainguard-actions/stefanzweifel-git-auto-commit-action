name: Test custom commit author and message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file to commit
        run: |
          echo "custom author test $(date)" > "$GITHUB_WORKSPACE/custom-author-test.txt"

      - id: action
        uses: .
        with:
          commit_message: "chore: automated update by custom bot"
          branch: act-harness
          skip_fetch: "true"
          skip_checkout: "true"
          skip_push: "true"
          file_pattern: "custom-author-test.txt"
          commit_user_name: "Custom Bot"
          commit_user_email: "custom-bot@example.com"
          commit_author: "Custom Bot <custom-bot@example.com>"

      - name: Assert changes_detected is true
        env:
          CHANGES: ${{ steps.action.outputs.changes_detected }}
          HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "changes_detected: $CHANGES"
          echo "commit_hash: $HASH"
          if [ "$CHANGES" != "true" ]; then
            echo "FAIL: expected changes_detected=true, got '$CHANGES'"
            exit 1
          fi
          if [ -z "$HASH" ]; then
            echo "FAIL: expected non-empty commit_hash"
            exit 1
          fi
          echo "PASS: changes committed with hash $HASH"

      - name: Assert commit author in git log
        run: |
          AUTHOR=$(git log -1 --pretty="%an <%ae>")
          echo "Commit author: $AUTHOR"
          if [ "$AUTHOR" != "Custom Bot <custom-bot@example.com>" ]; then
            echo "FAIL: expected 'Custom Bot <custom-bot@example.com>', got '$AUTHOR'"
            exit 1
          fi
          echo "PASS: commit author matches"

      - name: Assert commit message in git log
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $MSG"
          if [ "$MSG" != "chore: automated update by custom bot" ]; then
            echo "FAIL: expected 'chore: automated update by custom bot', got '$MSG'"
            exit 1
          fi
          echo "PASS: commit message matches"
