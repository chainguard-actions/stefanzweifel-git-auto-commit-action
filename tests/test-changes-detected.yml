name: Test changes detected and committed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a new file to simulate changes
        run: |
          echo "auto-generated content $(date)" > "$GITHUB_WORKSPACE/auto-generated.txt"

      - id: action
        uses: .
        with:
          commit_message: "Test: auto commit changes"
          branch: act-harness
          skip_fetch: "true"
          skip_checkout: "true"
          skip_push: "true"
          file_pattern: "auto-generated.txt"
          commit_user_name: "Test Bot"
          commit_user_email: "testbot@example.com"
          commit_author: "Test Bot <testbot@example.com>"

      - name: Assert changes_detected is true and commit_hash is set
        env:
          CHANGES: ${{ steps.action.outputs.changes_detected }}
          HASH: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "changes_detected: $CHANGES"
          echo "commit_hash: $HASH"
          if [ "$CHANGES" != "true" ]; then
            echo "FAIL: expected changes_detected=true, got '$CHANGES'"
            exit 1
          fi
          if [ -z "$HASH" ]; then
            echo "FAIL: expected non-empty commit_hash when changes detected"
            exit 1
          fi
          echo "PASS: changes detected and committed with hash $HASH"

      - name: Assert the file was committed in git log
        run: |
          LAST_MSG=$(git log -1 --pretty=%s)
          echo "Last commit message: $LAST_MSG"
          if [ "$LAST_MSG" != "Test: auto commit changes" ]; then
            echo "FAIL: expected commit message 'Test: auto commit changes', got '$LAST_MSG'"
            exit 1
          fi
          echo "PASS: commit message matches"
