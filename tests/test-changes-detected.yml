name: Test Changes Detected
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git and set up local remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a local bare repo to act as the remote so git push succeeds
          git init --bare /tmp/remote-repo.git
          git remote set-url origin /tmp/remote-repo.git
          git push origin HEAD:act-harness

      - name: Create a new file to trigger changes
        run: |
          echo "auto-generated content $(date)" > auto-generated.txt

      - id: action
        uses: .
        with:
          commit_message: "Test: auto commit changes"
          branch: act-harness
          file_pattern: "auto-generated.txt"
          commit_user_name: "Test Bot"
          commit_user_email: "bot@example.com"
          commit_author: "Test Bot <bot@example.com>"
          skip_fetch: "true"
          skip_checkout: "true"

      - name: Assert changes_detected is true
        env:
          ACTUAL: ${{ steps.action.outputs.changes_detected }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected changes_detected to be 'true', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: changes_detected is true as expected"

      - name: Assert commit_hash is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.commit_hash }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected commit_hash to be non-empty when changes detected"
            exit 1
          fi
          # Verify it looks like a git SHA (40 hex chars)
          if ! echo "$ACTUAL" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: commit_hash '$ACTUAL' does not look like a valid git SHA"
            exit 1
          fi
          echo "PASS: commit_hash is a valid SHA: $ACTUAL"
